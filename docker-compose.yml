services:
  postgres:
    image: postgres:17-alpine
    container_name: axinia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: axinia
      POSTGRES_USER: axinia
      POSTGRES_PASSWORD: axinia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: axinia-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
