services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: axinia-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: axinia-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: axinia
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - axinia_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d axinia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  axinia_prod_data:
